[package]
name = "warden-vault"
version = "0.1.0"
edition = "2021"
authors = ["Warden Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.7.0", features = ["legacy", "unit-testing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
# near-workspaces is optional for sandbox integration tests
# near-workspaces = { version = "0.14.0", features = ["unstable"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
